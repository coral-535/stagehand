name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: "https://npm.pkg.github.com"
          scope: "coral-535"

      - name: Update npm
        run: npm install -g npm@latest

      - name: Enable Corepack
        run: |
          npm install -g corepack@latest
          corepack enable

      - name: Get pnpm store directory
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Install dependencies
        run: |
          rm -rf node_modules
          pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish @coral-535/stagehand to GitHub Packages
        working-directory: packages/core
        run: |
          npm config delete always-auth --location=user || true
          npm pkg set name="@coral-535/stagehand"
          VERSION=$(npm pkg get version | tr -d '"')
          if npm view "@coral-535/stagehand@${VERSION}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@coral-535/stagehand@${VERSION} is already published. Skipping."
            exit 0
          fi
          npm publish --access public --registry=https://npm.pkg.github.com
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
